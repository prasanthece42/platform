name: Restore verified team runner
description: Restore the exact source snapshot and optionally the immutable Build job image.
inputs:
  source_digest:
    required: true
    description: Source job digest
  restore_image:
    default: 'true'
    description: Restore the Build job image
  image_id:
    default: ''
    description: Immutable image ID from Build
  image_digest:
    default: ''
    description: Image archive digest from Build
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: aegis-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/aegis-team-transfer/source
    - name: Verify source snapshot
      shell: bash
      env:
        EXPECTED_SOURCE_DIGEST: ${{ inputs.source_digest }}
      run: python "$GITHUB_WORKSPACE/platform/scripts/team_validation.py" restore-source
    - if: ${{ inputs.restore_image == 'true' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: aegis-runner-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/aegis-team-transfer/image
    - name: Verify and load runner image
      if: ${{ inputs.restore_image == 'true' }}
      shell: bash
      env:
        EXPECTED_IMAGE_ID: ${{ inputs.image_id }}
        EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
      run: python "$GITHUB_WORKSPACE/platform/scripts/team_validation.py" restore-image
