name: Team application pipeline
run-name: AegisAI ${{ inputs.request_id || github.run_id }}
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      pipeline_version:
        required: true
        type: string
      integration_tests:
        type: boolean
        default: false
      contract_evaluations:
        type: boolean
        default: false
      maximum_contract_latency_ms:
        type: string
        default: '5000'
permissions:
  contents: read
concurrency:
  group: aegisai-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    uses: prasanthece42/platform/.github/workflows/reusable-team-validation.yml@37997df5cf37e9fa2d77d03e84ff3bc43ea1d07f
    with:
      central_repository: prasanthece42/platform
      central_sha: '37997df5cf37e9fa2d77d03e84ff3bc43ea1d07f'
      source_directory: .
      pipeline_version: ${{ inputs.pipeline_version || 'repository-default' }}
      integration_tests: ${{ inputs.integration_tests || false }}
      contract_evaluations: ${{ inputs.contract_evaluations || false }}
      maximum_contract_latency_ms: ${{ inputs.maximum_contract_latency_ms || '5000' }}
  delivery:
    needs: validation
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.AEGISAI_DELIVERY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: prasanthece42/platform/.github/workflows/reusable-team-delivery.yml@2883c1b777c4c6042801a7de8d147e929ca5832c
    with:
      target_ref: payments-dev
      central_repository: prasanthece42/platform
      central_sha: '2883c1b777c4c6042801a7de8d147e929ca5832c'
